name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies & Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev libltdl-dev zip unzip
          pip install --upgrade pip
          pip install "cython==0.29.33" buildozer

      - name: Accept Licenses & Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          # Lizenzen im System-SDK akzeptieren
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Buildozer ausführen (nutzt das vorbereitete System-SDK)
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package-apk
          path: bin/*.apk
          if-no-files-found: error
