name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev \
            zlib1g-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev \
            libreadline-dev libffi-dev uuid-dev libncurses5-dev libncursesw5-dev \
            libdb5.3-dev zip unzip ccache git autoconf libtool pkg-config automake gettext

      - name: Install Buildozer & Tools
        run: |
          pip install --upgrade pip setuptools
          pip install Cython==0.29.33
          pip install buildozer

      - name: Clean Build & libffi Cache
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer/cache
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a/build/other_builds/libffi

      - name: Build with Buildozer
        timeout-minutes: 60
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-apk
          path: bin/*.apk
