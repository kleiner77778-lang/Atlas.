name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev libltdl-dev openjdk-17-jdk zip unzip
          pip install --upgrade pip
          pip install "setuptools<60.0.0" "cython==0.29.33" buildozer

      - name: Accept Android SDK Licenses & Build APK
        run: |
          # Führt die SDK-Lizenzzustimmung automatisch aus, sobald der SDK-Ordner erstellt wird
          mkdir -p ~/.buildozer/android/platform
          yes | buildozer android debug || true
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-apk
          path: bin/*.apk
          if-no-files-found: error
