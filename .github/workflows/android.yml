name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git python3-dev libncurses5:i386 zip unzip zlib1g-dev libssl-dev libffi-dev libltdl-dev autoconf automake libtool pkg-config cmake

      - name: Install Python Dependencies & Buildozer
        run: |
          pip install --upgrade pip setuptools
          pip install "cython<3.0.0"
          pip install buildozer

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Atlas-Tracker-APK
          path: bin/*.apk
